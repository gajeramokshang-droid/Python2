<!DOCTYPE html>
<html>
<head>
    <title>Cricket Players</title>
</head>
<body>
    <h1>Cricket Players</h1>
    <ul>
        {% for player in players %}
            <li>
                <a href="{% url 'player_detail' player.id %}">{{ player.name }}</a>
            </li>
        {% empty %}
            <li>No players found.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'add_player' %}">Add New Player</a>
</body>
</html>
