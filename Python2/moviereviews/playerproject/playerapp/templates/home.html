<!DOCTYPE html>
<html><body>
    <a href="{% url 'home' %}">Home</a> |
    <a href="{% url 'welcome' %}">Welcome</a> |
    <a href="/add_player/">Add Player</a>

<form method="GET">
<input type="text" name="search">
<button>Search</button>
</form>
{% if players %}
<table border="1">
<tr><th>Name</th><th>Test Innings</th><th>Runs</th><th>Action</th></tr>
{% for player in players %}
<tr>
    <!-- Use lowercase 'player' to match your loop variable -->
    <td>{{ player.name }}</td>
    <td>{{ player.test_innings }}</td>
    <td>{{ player.runs }}</td>
    <td>
        <a href="/edit_player/{{ player.id }}">Edit</a> 
        <a href="/delete/{{ player.id }}">Delete</a>
    </td>
</tr>
{% endfor %}

</table>
{% else %}
<h3>No Record Found</h3>
{% endif %}
</body></html>
