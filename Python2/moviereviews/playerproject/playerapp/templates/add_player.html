<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Player</title>
</head>
<body>
    <a href="{% url 'home' %}">Home</a> | <a href="{% url 'welcome' %}">Welcome</a>
    <hr>
    <h2>Add New Player</h2>
    <form method="POST">
        {% csrf_token %}
        Name: <input type="text" name="name" required><br><br>
        Innings: <input type="number" name="innings" required><br><br>
        Runs: <input type="number" name="runs" required><br><br>
        <input type="submit" value="Save">
    </form>
</body>
</html>
