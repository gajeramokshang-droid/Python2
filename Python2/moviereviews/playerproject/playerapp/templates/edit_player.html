<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Player</title>
</head>
<body>
    <a href="{% url 'home' %}">Home</a> | <a href="{% url 'welcome' %}">Welcome</a>
    <hr>
    <h2>Edit Player Details</h2>
    <form method="POST">
        {% csrf_token %}
        Name: <input type="text" name="name" value="{{ player.name }}" required><br><br>
        Innings: <input type="number" name="innings" value="{{ player.test_innings }}" required><br><br>
        Runs: <input type="number" name="runs" value="{{ player.runs }}" required><br><br>
        <input type="submit" value="Update">
    </form>
</body>
</html>
